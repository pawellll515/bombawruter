
name: Build BombaWruter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Nadanie uprawnień Gradle
        run: chmod +x gradlew
        continue-on-error: true

      - name: Budowanie pluginu
        run: |
          if [ -f gradlew ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Udostępnienie pliku JAR
        uses: actions/upload-artifact@v4
        with:
          name: BombaWruter
          path: build/libs/*.jar
          
